name: ONNX Runtime builder Android

on:
  push:
    branches:
      - main
    paths:
      - "tools/onnxruntime-build/source-lock.json"
      - "tools/onnxruntime-build/onnxruntime-build"
      - "tools/onnxruntime-build/onnxruntime_build/**"
      - "!tools/onnxruntime-build/onnxruntime_build/recipes/**"
      - "tools/onnxruntime-build/onnxruntime_build/recipes/__init__.py"
      - "tools/onnxruntime-build/onnxruntime_build/recipes/android.py"
      - ".github/actions/onnxruntime-artifact/**"
      - ".github/workflows/onnxruntime-builder-android.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tools/onnxruntime-build/source-lock.json"
      - "tools/onnxruntime-build/onnxruntime-build"
      - "tools/onnxruntime-build/onnxruntime_build/**"
      - "!tools/onnxruntime-build/onnxruntime_build/recipes/**"
      - "tools/onnxruntime-build/onnxruntime_build/recipes/__init__.py"
      - "tools/onnxruntime-build/onnxruntime_build/recipes/android.py"
      - ".github/actions/onnxruntime-artifact/**"
      - ".github/workflows/onnxruntime-builder-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onnxruntime-builder-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: "17"

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install exact Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.0.13004108" >> "${GITHUB_ENV}"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - uses: ./.github/actions/onnxruntime-artifact
        with:
          target: android
