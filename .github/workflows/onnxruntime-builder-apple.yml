name: ONNX Runtime builder Apple

on:
  push:
    branches:
      - main
    paths:
      - "tools/onnxruntime-build/source-lock.json"
      - "tools/onnxruntime-build/onnxruntime-build"
      - "tools/onnxruntime-build/onnxruntime_build/**"
      - "!tools/onnxruntime-build/onnxruntime_build/recipes/**"
      - "tools/onnxruntime-build/onnxruntime_build/recipes/__init__.py"
      - "tools/onnxruntime-build/onnxruntime_build/recipes/apple_xcframework.py"
      - "tools/onnxruntime-build/onnxruntime_build/recipes/macos_static.py"
      - ".github/actions/onnxruntime-artifact/**"
      - ".github/workflows/onnxruntime-builder-apple.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tools/onnxruntime-build/source-lock.json"
      - "tools/onnxruntime-build/onnxruntime-build"
      - "tools/onnxruntime-build/onnxruntime_build/**"
      - "!tools/onnxruntime-build/onnxruntime_build/recipes/**"
      - "tools/onnxruntime-build/onnxruntime_build/recipes/__init__.py"
      - "tools/onnxruntime-build/onnxruntime_build/recipes/apple_xcframework.py"
      - "tools/onnxruntime-build/onnxruntime_build/recipes/macos_static.py"
      - ".github/actions/onnxruntime-artifact/**"
      - ".github/workflows/onnxruntime-builder-apple.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

concurrency:
  group: onnxruntime-builder-apple-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  arm:
    name: ${{ matrix.target }}
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ios-static-xcframework
          - target: osx-arm64-static_lib

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Select exact Xcode
        run: |
          test -d "${DEVELOPER_DIR}"
          test "$(xcodebuild -version)" = $'Xcode 16.4\nBuild version 16F6'
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"

      - uses: ./.github/actions/onnxruntime-artifact
        with:
          target: ${{ matrix.target }}

  intel:
    name: osx-x86_64-static_lib
    runs-on: macos-15-intel
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Select exact Xcode
        run: |
          test -d "${DEVELOPER_DIR}"
          test "$(xcodebuild -version)" = $'Xcode 16.4\nBuild version 16F6'
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"

      - uses: ./.github/actions/onnxruntime-artifact
        with:
          target: osx-x86_64-static_lib
