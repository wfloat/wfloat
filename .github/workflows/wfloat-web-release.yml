name: Wfloat Web Release

on:
  push:
    tags:
      - "wfloat-web-v*"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Publish package
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Validate tag version
        working-directory: packages/wfloat-web
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#wfloat-web-v}"
          package_version=$(node --print "require('./package.json').version")
          test "$tag_version" = "$package_version"

      - name: Install dependencies
        working-directory: packages/wfloat-web
        run: npm install

      - name: Build WebAssembly runtimes
        working-directory: packages/wfloat-web
        run: npm run build:wasm

      - name: Publish release WebAssembly runtimes
        working-directory: packages/wfloat-web
        run: bash scripts/publish-web-wasms.sh

      - name: Build installed package in browser consumer
        working-directory: packages/wfloat-web
        run: npm run package:browser-smoke

      - name: Publish package
        working-directory: packages/wfloat-web
        run: npm publish --access public --provenance
