name: ONNX Runtime artifact publication

on:
  workflow_call:

jobs:
  publish:
    name: Publish and verify immutable registry objects
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: onnxruntime-*
          path: .onnxruntime-artifacts
          merge-multiple: true

      - name: Publish and verify immutable registry objects
        run: python -I -B scripts/publish_onnxruntime_artifacts.py .onnxruntime-artifacts
