name: Wfloat Web CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/wfloat-web/**"
      - "scripts/ensure-emscripten.sh"
      - "vendor/llama.cpp/**"
      - "vendor/sherpa-onnx/**"
      - ".github/workflows/wfloat-web-ci.yml"
      - ".github/workflows/wfloat-web-release.yml"
  pull_request:
    branches:
      - main
    paths:
      - "packages/wfloat-web/**"
      - "scripts/ensure-emscripten.sh"
      - "vendor/llama.cpp/**"
      - "vendor/sherpa-onnx/**"
      - ".github/workflows/wfloat-web-ci.yml"
      - ".github/workflows/wfloat-web-release.yml"

permissions:
  contents: read
  id-token: write

jobs:
  browser_consumer:
    name: Browser consumer package smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: packages/wfloat-web
        run: npm install

      - name: Build WebAssembly runtimes
        working-directory: packages/wfloat-web
        run: npm run build:wasm

      - name: Publish CI WebAssembly runtimes
        working-directory: packages/wfloat-web
        run: bash scripts/publish-web-wasms.sh

      - name: Build installed package in browser consumer
        working-directory: packages/wfloat-web
        run: npm run package:browser-smoke
